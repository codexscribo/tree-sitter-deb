name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      ts_version:
        description: "tree-sitter tag to package (e.g. v0.26.10) or 'latest'"
        required: false
        default: latest
  schedule:
    # Daily check for a new upstream tree-sitter release. No-ops (skips the
    # rest of the workflow) if we already published a release for the
    # current upstream version.
    - cron: "17 6 * * *"

permissions:
  contents: write

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      ts_tag: ${{ steps.resolve.outputs.ts_tag }}
      deb_revision: ${{ steps.resolve.outputs.deb_revision }}
      release_tag: ${{ steps.resolve.outputs.release_tag }}
      should_release: ${{ steps.resolve.outputs.should_release }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve target version
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_TS_VERSION: ${{ inputs.ts_version }}
        run: |
          set -euo pipefail
          DEB_REVISION="1"

          if [[ "${EVENT_NAME}" == "push" ]]; then
            # Tag push, e.g. v0.26.10-1 -> ts_tag=v0.26.10, deb_revision=1
            RELEASE_TAG="${REF_NAME}"
            TS_TAG="v$(echo "${RELEASE_TAG#v}" | sed -E 's/-[0-9]+$//')"
            DEB_REVISION="$(echo "${RELEASE_TAG}" | sed -E 's/^.*-([0-9]+)$/\1/')"
            SHOULD_RELEASE="true"
          else
            TS_VERSION_INPUT="${INPUT_TS_VERSION:-latest}"
            if [[ "${TS_VERSION_INPUT}" == "latest" ]]; then
              LATEST_JSON="$(curl -fsSL https://api.github.com/repos/tree-sitter/tree-sitter/releases/latest)"
              TS_TAG="$(echo "${LATEST_JSON}" | grep -m1 '"tag_name"' | sed -E 's/.*"tag_name": *"([^"]+)".*/\1/')"
            else
              TS_TAG="${TS_VERSION_INPUT}"
            fi
            RELEASE_TAG="v$(echo "${TS_TAG#v}")-${DEB_REVISION}"

            if gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
              echo "Release ${RELEASE_TAG} already exists."
              if [[ "${EVENT_NAME}" == "schedule" ]]; then
                SHOULD_RELEASE="false"
              else
                # Manual re-run explicitly asked for this version: rebuild anyway.
                SHOULD_RELEASE="true"
              fi
            else
              SHOULD_RELEASE="true"
            fi
          fi

          echo "ts_tag=${TS_TAG}" | tee -a "${GITHUB_OUTPUT}"
          echo "deb_revision=${DEB_REVISION}" | tee -a "${GITHUB_OUTPUT}"
          echo "release_tag=${RELEASE_TAG}" | tee -a "${GITHUB_OUTPUT}"
          echo "should_release=${SHOULD_RELEASE}" | tee -a "${GITHUB_OUTPUT}"

  build:
    needs: resolve
    if: needs.resolve.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [amd64, arm64]
    env:
      DEB_REVISION: ${{ needs.resolve.outputs.deb_revision }}
    steps:
      - uses: actions/checkout@v4

      - name: Build .deb (${{ matrix.arch }})
        run: |
          ./scripts/build.sh \
            --version "${{ needs.resolve.outputs.ts_tag }}" \
            --arch "${{ matrix.arch }}"

      - uses: actions/upload-artifact@v4
        with:
          name: deb-${{ matrix.arch }}
          path: dist/*.deb
          if-no-files-found: error

  test:
    needs: [resolve, build]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        distro:
          - "ubuntu:22.04"
          - "ubuntu:24.04"
          - "ubuntu:26.04"
          - "debian:11"
          - "debian:12"
          - "debian:13"
        arch: [amd64, arm64]
    # tree-sitter releases since v0.25.0 require GLIBC >= 2.39 (a known,
    # still-unresolved upstream issue: tree-sitter/tree-sitter#4174). That
    # is not available on Debian 11/12 or Ubuntu 22.04, so the binary
    # installs there but fails to run. Keep testing those targets for
    # visibility, but don't let a known upstream limitation block the
    # release.
    continue-on-error: ${{ contains(fromJSON('["ubuntu:22.04","debian:11","debian:12"]'), matrix.distro) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: deb-*
          path: dist
          merge-multiple: true

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Install / smoke-test / uninstall on ${{ matrix.distro }} (${{ matrix.arch }})
        run: |
          ./scripts/test.sh --arch "${{ matrix.arch }}" --distro "${{ matrix.distro }}"

  publish:
    needs: [resolve, build, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: deb-*
          path: dist
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: sha256sum *.deb > SHA256SUMS

      - name: Create / update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${{ needs.resolve.outputs.release_tag }}"
          TS_TAG="${{ needs.resolve.outputs.ts_tag }}"

          if ! git rev-parse "${TAG}" >/dev/null 2>&1; then
            git tag "${TAG}"
            git push origin "${TAG}"
          fi

          if gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload "${TAG}" dist/*.deb dist/SHA256SUMS --repo "${GITHUB_REPOSITORY}" --clobber
          else
            gh release create "${TAG}" dist/*.deb dist/SHA256SUMS \
              --repo "${GITHUB_REPOSITORY}" \
              --title "tree-sitter-cli ${TAG#v}" \
              --notes "Repackage of the official tree-sitter CLI binary release [${TS_TAG}](https://github.com/tree-sitter/tree-sitter/releases/tag/${TS_TAG}) as a .deb for Debian/Ubuntu (amd64, arm64)."
          fi
